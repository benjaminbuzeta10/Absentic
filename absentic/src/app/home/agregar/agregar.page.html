<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Agregar ramo</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <main class="formulario-agregar">
    <section class="seccion-formulario">
      <h2>Datos del ramo</h2>
      <ion-input
        label="Nombre del ramo"
        label-placement="stacked"
        fill="outline"
        placeholder="Ej. Matemáticas"
      ></ion-input>
      <ion-input
        class="asistencia-input"
        label="Asistencia mínima"
        label-placement="stacked"
        fill="outline"
        type="number"
        min="0"
        max="100"
        value="75"
        helper-text="Porcentaje requerido para aprobar"
      ></ion-input>
    </section>

    <section class="seccion-formulario">
      <h2>Fechas del semestre</h2>
      <div class="fechas-semestre">
        <div class="selector-fecha">
          <span>Inicio</span>
          <ion-datetime-button datetime="fecha-inicio"></ion-datetime-button>
          <ion-modal [keepContentsMounted]="true">
            <ng-template>
              <ion-datetime
                id="fecha-inicio"
                presentation="date"
                [showDefaultButtons]="true"
              ></ion-datetime>
            </ng-template>
          </ion-modal>
        </div>
        <div class="selector-fecha">
          <span>Término</span>
          <ion-datetime-button datetime="fecha-termino"></ion-datetime-button>
          <ion-modal [keepContentsMounted]="true">
            <ng-template>
              <ion-datetime
                id="fecha-termino"
                presentation="date"
                [showDefaultButtons]="true"
              ></ion-datetime>
            </ng-template>
          </ion-modal>
        </div>
      </div>
    </section>

    <section class="seccion-formulario">
      <div class="encabezado-seccion">
        <h2>Bloques de horario</h2>
        <ion-button type="button" fill="outline" size="small" (click)="agregarBloque()">
          <ion-icon name="add-outline" slot="start" aria-hidden="true"></ion-icon>
          Agregar
        </ion-button>
      </div>

      @for (bloque of bloques; track $index) {
        <div class="bloque-horario">
          <div class="encabezado-bloque">
            <h3>Bloque {{ $index + 1 }}</h3>
          </div>
          <div class="dias-botones" role="group" [attr.aria-label]="'Día del bloque ' + ($index + 1)">
            @for (dia of dias; track dia) {
              <ion-button
                class="boton-dia"
                type="button"
                size="small"
                [fill]="bloque.dia === dia ? 'solid' : 'outline'"
                [attr.aria-pressed]="bloque.dia === dia"
                (click)="seleccionarDia(bloque, dia)"
              >
                {{ dia }}
              </ion-button>
            }
          </div>
          <div class="horas-bloque">
            <ion-input
              label="Inicio"
              label-placement="stacked"
              fill="outline"
              type="time"
              [(ngModel)]="bloque.inicio"
              [ngModelOptions]="{ standalone: true }"
            ></ion-input>
            <ion-input
              label="Término"
              label-placement="stacked"
              fill="outline"
              type="time"
              [(ngModel)]="bloque.termino"
              [ngModelOptions]="{ standalone: true }"
            ></ion-input>
          </div>
        </div>
      }
    </section>

    <div class="acciones-formulario">
      <ion-button type="button" fill="clear" color="medium">Cancelar</ion-button>
      <ion-button type="button">Guardar ramo</ion-button>
    </div>
  </main>
</ion-content>
